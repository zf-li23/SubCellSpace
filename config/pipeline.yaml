# ═════════════════════════════════════════════════════════════════════
# SubCellSpace — Unified Pipeline Configuration
#
# Single scverse-native pipeline using only scanpy + squidpy + numpy.
# No external model downloads, no GPU requirements, no network access.
#
# Integrated with CosMx companion files (polygons, expression matrix,
# cell metadata, FOV positions) when available.
# ═════════════════════════════════════════════════════════════════════

pipeline:
  name: "subcellspace"
  description: "Unified SubCellSpace pipeline — scverse ecosystem, zero external dependencies"
  version: "0.2.0"

  steps:
    - denoise
    - patchify
    - segmentation
    - analysis
    - annotation
    - spatial_analysis
    - subcellular_analysis

  steps_config:
    denoise:
      module: "src.steps.denoise"
      default_backend: "intracellular"
      description: "Filter non-coding transcripts by CellComp (Nuclear/Cytoplasm only)"
      enabled: true

    patchify:
      module: "src.steps.patchify"
      default_backend: "none"
      description: "Spatial grid patching (disabled in single-threaded mode)"
      params:
        patch_width: 500.0
        patch_overlap: 50.0
      enabled: true

    segmentation:
      module: "src.steps.segmentation"
      default_backend: "fov_cell_id"
      description: "Assign transcripts to cells using FOV-prefixed cell IDs"
      enabled: true

    analysis:
      module: "src.steps.analysis"
      default_backend: "leiden"
      description: "Leiden clustering + PCA + UMAP + QC filtering (scanpy)"
      params:
        min_transcripts: 10
        min_genes: 10
        clustering_backend: "leiden"
        leiden_resolution: 1.0
      enabled: true

    annotation:
      module: "src.steps.annotation"
      default_backend: "rank_marker"
      description: "Marker-gene based cell type annotation (scanpy rank_genes_groups)"
      enabled: true

    spatial_analysis:
      module: "src.steps.spatial_analysis"
      default_backend: "squidpy"
      description: "Multi-faceted spatial analysis: domains, SVG, neighborhood enrichment, co-occurrence"
      params:
        domain_backend: "spatial_leiden"
      enabled: true

    subcellular_analysis:
      module: "src.steps.subcellular_analysis"
      default_backend: "none"
      description: "Subcellular analysis (disabled — no scverse-native backend available)"
      enabled: true
