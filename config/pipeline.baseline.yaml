# ═════════════════════════════════════════════════════════════════════
# SubCellSpace — Baseline Pipeline Configuration
#
# Minimal-overhead baseline for ablation studies:
#   none denoise  →  provided_cells segmentation  →  Leiden clustering
#   →  rank_marker annotation  →  Squidpy spatial  →  SCRIN + none
#
# SCRIN is kept (same as prod) so that the only variables are:
#   denoise, segmentation, annotation
# ═════════════════════════════════════════════════════════════════════

pipeline:
  name: "baseline"
  description: "Baseline pipeline: no denoising, platform-provided segmentation, rank-marker annotation, no spatial analysis"
  version: "0.1.0"

  steps:
    - denoise
    - patchify
    - segmentation
    - analysis
    - annotation
    - spatial_analysis
    - subcellular_analysis

  steps_config:
    denoise:
      module: "src.steps.denoise"
      default_backend: "none"
      description: "No denoising (pass-through)"
      enabled: true

    patchify:
      module: "src.steps.patchify"
      default_backend: "none"
      description: "No patching"
      params:
        patch_width: 500.0
        patch_overlap: 50.0
      enabled: true

    segmentation:
      module: "src.steps.segmentation"
      default_backend: "provided_cells"
      description: "Use platform-provided cell assignments (no re-segmentation)"
      enabled: true

    analysis:
      module: "src.steps.analysis"
      default_backend: "leiden"
      description: "Leiden clustering (same as prod)"
      params:
        min_transcripts: 10
        min_genes: 10
        clustering_backend: "leiden"
        leiden_resolution: 1.0
      enabled: true

    annotation:
      module: "src.steps.annotation"
      default_backend: "rank_marker"
      description: "Marker-gene based annotation (no external reference)"
      enabled: true

    spatial_analysis:
      module: "src.steps.spatial_analysis"
      default_backend: "none"
      description: "No spatial analysis (baseline)"
      params:
        domain_backend: "none"
      enabled: true

    subcellular_analysis:
      module: "src.steps.subcellular_analysis"
      default_backend: "scrin"
      description: "SCRIN co-localization (same as prod, for fair comparison)"
      params:
        subcellular_domain_backend: "hdbscan"
        scrin_radius: 4.16
        scrin_mode: "fast"
        scrin_background: "cooccurrence"
        scrin_detection: "radius"
      enabled: true
