# ═════════════════════════════════════════════════════════════════════
# SubCellSpace — Production Pipeline Configuration
#
# Meaningful backends for real biological insight:
#   spARC denoise  →  Cellpose segmentation  →  Leiden clustering
#   →  CellTypist annotation  →  Squidpy spatial  →  SCRIN + HDBSCAN
#
# Compare with config/pipeline.baseline.yaml for ablation studies.
# ═════════════════════════════════════════════════════════════════════

pipeline:
  name: "prod"
  description: "Production pipeline with spARC denoise, Cellpose segmentation, CellTypist annotation, and SCRIN subcellular analysis"
  version: "0.1.0"

  steps:
    - denoise
    - patchify
    - segmentation
    - analysis
    - annotation
    - spatial_analysis
    - subcellular_analysis

  steps_config:
    denoise:
      module: "src.steps.denoise"
      default_backend: "sparc"
      description: "Spatially-aware diffusion-based denoising (spARC)"
      enabled: true

    patchify:
      module: "src.steps.patchify"
      default_backend: "none"
      description: "Spatial grid patching for parallel processing (disabled in single-threaded mode)"
      params:
        patch_width: 500.0
        patch_overlap: 50.0
      enabled: true

    segmentation:
      module: "src.steps.segmentation"
      default_backend: "cellpose"
      description: "Deep-learning cell segmentation via Cellpose (falls back to fov_cell_id if no image available)"
      params:
        model_type: "nuclei"
        diameter: null
        flow_threshold: 0.4
        cellprob_threshold: 0.0
      enabled: true

    analysis:
      module: "src.steps.analysis"
      default_backend: "leiden"
      description: "Leiden clustering + PCA + UMAP + QC filtering"
      params:
        min_transcripts: 10
        min_genes: 10
        clustering_backend: "leiden"
        leiden_resolution: 1.0
      enabled: true

    annotation:
      module: "src.steps.annotation"
      default_backend: "celltypist"
      description: "Automated cell-type annotation using CellTypist reference models"
      params:
        model_name: "Immune_All_Low.pkl"
      enabled: true

    spatial_analysis:
      module: "src.steps.spatial_analysis"
      default_backend: "squidpy"
      description: "Multi-faceted spatial analysis: domains, SVG, neighborhood enrichment, co-occurrence"
      params:
        domain_backend: "spatial_leiden"
      enabled: true

    subcellular_analysis:
      module: "src.steps.subcellular_analysis"
      default_backend: "scrin"
      description: "HDBSCAN subcellular domains + SCRIN RNA co-localization network"
      params:
        subcellular_domain_backend: "hdbscan"
        scrin_radius: 4.16
        scrin_mode: "fast"
        scrin_background: "cooccurrence"
        scrin_detection: "radius"
      enabled: true
