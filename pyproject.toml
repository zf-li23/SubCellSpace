[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subcellspace"
version = "0.1.0"
description = "A modular subcellular spatial transcriptomics analysis platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "SubCellSpace Contributors"},
]
keywords = ["spatial-transcriptomics", "subcellular", "single-cell", "spatialdata", "scanpy", "sopa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  # ── sopa + spatialdata stack (IO, patchify, aggregation) ──
  "sopa>=2.2",
  "spatialdata>=0.7",
  "spatialdata-io>=0.3",

  # ── Core analysis stack ──
  "scanpy>=1.11",
  "squidpy>=1.7",
  "anndata>=0.12",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "numpy>=2.0",
  "pandas>=2.2",
  "igraph>=0.11",
  "leidenalg>=0.10",
  "hdbscan>=0.8.42",
  "shapely>=2.0",
  "geopandas>=1.0",

  # ── Web / API / CLI ──
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# ── Segmentation backends ──
cellpose = ["cellpose>=3.0"]
baysor = ["toml>=0.10.2", "loompy>=3.0.7"]  # Julia binary required separately

# ── Analysis backends ──
scvi = ["scvi-tools>=1.0"]

# ── Annotation backends ──
celltypist = ["celltypist>=1.6"]

# ── Workflow engine ──
snakemake = ["snakemake>=9.0"]

# ── All pip-installable extras ──
all = ["subcellspace[cellpose,baysor,scvi,celltypist,snakemake]"]

# ── Development ──
dev = ["pytest>=8.0", "pytest-cov>=4.0", "ruff>=0.6", "mypy>=1.11", "httpx>=0.28.1"]

# ── Git-clone-only backends (NOT pip-installable) ──
# spARC, PhenoGraph, scFates — clone from tools/ and `pip install -e tools/<name>/`
# SCRIN — MPI-based, cluster-only manual install
# See THIRD_PARTY_TOOLS.md for details.


[project.urls]
Homepage = "https://github.com/your-org/subcellspace"
Repository = "https://github.com/your-org/subcellspace"
Issues = "https://github.com/your-org/subcellspace/issues"

[project.scripts]
subcellspace = "src.cli:main"
subcellspace-api = "src.api_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
]
ignore = ["E501"]  # line-length is handled by ruff formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disable_error_code = [
    "type-arg",      # numpy/scipy/pandas stubs not fully aligned
    "var-annotated", # some untyped class vars ok in dataclasses
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "tools/*", "scripts/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
    "def __repr__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]