[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subcellspace"
version = "0.3.0"
description = "GEO database, completion layer and cell-level reports for imaging spatial transcriptomics (CosMx / Xenium / MERFISH), built on SOPA"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "SubCellSpace Contributors"},
]
keywords = ["spatial-transcriptomics", "geo", "xenium", "cosmx", "merfish", "spatialdata", "sopa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  # ── Analysis stack (SOPA does segmentation / aggregation / preprocessing) ──
  "sopa>=2.2",
  "spatialdata>=0.7",
  "spatialdata-io>=0.3",
  "scanpy>=1.11",
  "anndata>=0.12",

  # ── GEO adapters, touch, statistics ──
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "shapely>=2.0",
  "geopandas>=1.0",
  "zarr>=3.0",
  "requests>=2.31",

  # ── Local dev API for the frontend ──
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "ruff>=0.6", "httpx>=0.28.1"]


[project.urls]
Homepage = "https://github.com/zf-li23/SubCellSpace"
Repository = "https://github.com/zf-li23/SubCellSpace"
Issues = "https://github.com/zf-li23/SubCellSpace/issues"

[project.scripts]
subcellspace = "src.cli:main"
subcellspace-api = "src.api_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
]
ignore = ["E501"]  # line-length is handled by ruff formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]            # pytest fixtures are injected by name
"src/io/*" = ["ARG002"]           # ingestor hooks keep a uniform signature
"src/geo/*" = ["ARG001"]          # registry helpers share a (csv_path, gsm_col) signature

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "tools/*", "scripts/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
    "def __repr__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]