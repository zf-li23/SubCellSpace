# ─────────────────────────────────────────────────────────────────────
# SubCellSpace Third-Party Tools Registry
# ─────────────────────────────────────────────────────────────────────
# This file stores third-party tool repository URLs for the git-clone-
# only backends.  Most backends are now pip-installable (see pyproject.toml).
#
# Usage:
#   bash scripts/setup-tools.sh clone [tool_name...]  # clone specified tools
#   bash scripts/setup-tools.sh list                  # list all tools
# ─────────────────────────────────────────────────────────────────────

tools:
  spARC:
    description: "Spatial Affinity-Graph Recovery of Counts (denoise)"
    https: "https://github.com/KrishnaswamyLab/sparc.git"
    ssh: "git@github.com:KrishnaswamyLab/sparc.git"
    pip_install: "-e tools/spARC/"
    category: "denoise"

  PhenoGraph:
    description: "Graph-based subpopulation detection (subcellular domain)"
    https: "https://github.com/jacoblevine/PhenoGraph.git"
    ssh: "git@github.com:jacoblevine/PhenoGraph.git"
    pip_install: "-e tools/PhenoGraph/"
    category: "subcellular_analysis"

  scFates:
    description: "Tree inference and pseudotime trajectory (spatial analysis)"
    https: "https://github.com/LouisFaure/scFates.git"
    ssh: "git@github.com:LouisFaure/scFates.git"
    pip_install: "-e tools/scFates/"
    category: "spatial_analysis"

  SCRIN:
    description: "Subcellular co-localized RNA interaction network"
    https: "https://github.com/xryanglab/SCRIN.git"
    ssh: "git@github.com:xryanglab/SCRIN.git"
    pip_install: "manual"
    category: "subcellular_analysis"
    notes: "Cluster-only. Requires MPI. Install manually on the cluster."

# Tools installed directly from PyPI (no git clone needed)
# These are listed for reference but configured via pyproject.toml extras:
#   cellpose  → pip install subcellspace[cellpose]
#   scvi      → pip install subcellspace[scvi]
#   celltypist → pip install subcellspace[celltypist]
#   baysor    → pip install subcellspace[baysor] + Julia binary
#   sopa      → pip install sopa (core dependency)
#   hdbscan   → pip install hdbscan (core dependency)