# environment.yml
# SubCellSpace Conda 环境定义
#
# 这个文件只做一件事：创建一个只带 Python 3.12 和 pip 的空 conda 环境。
# 所有 Python 包的安装全部委托给 pyproject.toml 的 pip install -e .
#
# 使用方式：
#   conda env create -f environment.yml
#   conda activate subcellspace
#   pip install -e ".[dev]"           # 依赖（含 SOPA）+ 测试工具 (pytest, ruff)

name: subcellspace
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip