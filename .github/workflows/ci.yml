name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  COSMX_DATA: data/test/Mouse_brain_CosMX_1000cells.csv
  COSMX_ZENODO: https://zenodo.org/api/records/17019789/files/Mouse_brain_CosMX_1000cells.csv/content

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libigraph-dev libhdf5-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install hdbscan

      - name: Download test data
        run: |
          mkdir -p data/test
          curl -L -o "$COSMX_DATA" "$COSMX_ZENODO"

      - name: Quick lint (undefined names only)
        run: ruff check src/ tests/ --select=F821

      - name: Test with pytest
        run: pytest tests/ -v --tb=short -k "not baysor" --timeout=180

  smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libigraph-dev libhdf5-dev

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install hdbscan

      - name: Download test data
        run: |
          mkdir -p data/test
          curl -L -o "$COSMX_DATA" "$COSMX_ZENODO"

      - name: CLI help + backends
        run: |
          subcellspace --help
          subcellspace backends

      - name: Ingest CosMx
        run: subcellspace ingest cosmx "$COSMX_DATA" --json

      - name: Run CosMx pipeline
        run: |
          subcellspace run "$COSMX_DATA" \
            -o outputs/ci_test/ \
            --subcellular-domain-backend none \
            --no-export
